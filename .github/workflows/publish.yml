# Build the Armory web image in CI, push it to GHCR, and deploy it on the VPS.
#
# Images are built here, never on the VPS: it has 2 vCPU and may be serving
# live traffic. The server holds no long-lived registry credential — the deploy
# step logs in with this job's own GITHUB_TOKEN and logs out again.
name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", ".gitignore"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/adminoryslabs/armory-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Collapse targets that need identical files into ONE image: two images
        # of the same code means pulling the same bytes twice on every deploy.
        include:
          - name: app
            target: runner

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          secrets: npm_token=${{ secrets.NPM_TOKEN }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-armory-web-production
      cancel-in-progress: false

    env:
      # A pull can go minutes without output. Without keepalives something
      # between the runner and the VPS drops the connection mid-deploy.
      SSH_OPTS: >-
        -o ServerAliveInterval=15
        -o ServerAliveCountMax=20
        -o TCPKeepAlive=yes
        -o ConnectTimeout=20

    steps:
      - uses: actions/checkout@v5

      - name: Authorise the runner against the VPS
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship the compose file and the deploy script
        run: |
          scp $SSH_OPTS -i ~/.ssh/deploy_key deploy/docker-compose.yml deploy/deploy.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/apps/armory-web/"

      - name: Deploy
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh $SSH_OPTS -i ~/.ssh/deploy_key \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "IMAGE_TAG='${{ github.sha }}' ACTOR='${{ github.actor }}' bash /opt/apps/armory-web/deploy.sh"

      - name: Verify the site answers over TLS
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              https://armory.oryslabs.com/api/health || echo 000)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "the site never returned 200 over TLS"
          exit 1
